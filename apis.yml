name: Kipu Quantum
description: 'Kipu Quantum GmbH is a Berlin-based deep-tech company building application-specific,
  hardware-efficient quantum algorithms and delivering them as a managed cloud platform.
  Its flagship product, the Kipu Quantum Hub (hub.kipu-quantum.com), is an end-to-end
  platform for industrial quantum computing: it provides unified access to 20+ quantum
  backends (IBM Quantum, IonQ, IQM, QuEra, Rigetti, Pasqal, Azure Quantum), a visual
  workflow designer for quantum-classical pipelines, an AI "matchmaker" (Tinkuq) that
  translates a business problem into a solver configuration, and a Quantum Service Store
  of pre-built solvers (Miray, Rimay, Iskay, HUK) targeting optimization, portfolio mix,
  network routing, and classification. Developers automate runs and integrate via a
  Python SDK, REST API, and CLI, authenticating with API keys and OAuth2/OIDC (Keycloak,
  PlanQK realm). Founded and led by Prof. Dr. Enrique Solano and Dr. Tobias Grab. Backed
  by HV Capital and surfaced into the API Evangelist network via VC-portfolio enrichment.'
